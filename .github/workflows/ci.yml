name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & debug build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests (both flavors)
        run: ./gradlew testSentryDebugUnitTest testNoSentryDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          retention-days: 14

      - name: Run lint (both flavors)
        run: ./gradlew lintSentryDebug lintNoSentryDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          # AGP now ignores the lint{} block's htmlOutput/sarifOutput and writes each variant's
          # report next to build/reports/ directly, named by variant rather than into lint/.
          path: app/build/reports/lint-results-*
          retention-days: 14

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          # One flavor's findings are representative enough for code scanning; the full
          # per-variant reports are still in the lint-report artifact above.
          sarif_file: app/build/reports/lint-results-sentryDebug.sarif
        continue-on-error: true   # SARIF upload requires Advanced Security; skip gracefully on free repos

      - name: Build debug APKs (both flavors)
        run: ./gradlew assembleSentryDebug assembleNoSentryDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: tellyfin-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/sentry/debug/app-sentry-debug.apk
            app/build/outputs/apk/noSentry/debug/app-noSentry-debug.apk
          retention-days: 7
