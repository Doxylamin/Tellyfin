name: Release

# Triggered by version tags: v1.0.0, v1.2.3-beta, etc.
on:
  push:
    tags:
      - "v*"

# Required secrets (set in Settings → Secrets → Actions):
#   KEYSTORE_BASE64    base64-encoded release keystore  (openssl base64 -in release.jks)
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          signing key alias
#   KEY_PASSWORD       signing key password
#   SENTRY_AUTH_TOKEN  optional — uploads proguard mappings for the sentry flavor only;
#                      the noSentry flavor doesn't depend on Sentry at all, nothing to upload

jobs:
  release:
    name: Build & publish release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git rev-list commit count

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Derive version info from tag
        run: |
          # Strip the leading 'v' from the tag name (v1.2.3 → 1.2.3)
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          # Total commit count gives a monotonically increasing versionCode
          VERSION_CODE="$(git rev-list --count HEAD)"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "SENTRY_APK_NAME=tellyfin-sentry-${VERSION_NAME}.apk" >> "$GITHUB_ENV"
          echo "NOSENTRY_APK_NAME=tellyfin-nosentry-${VERSION_NAME}.apk" >> "$GITHUB_ENV"
          echo "STORE_APK_NAME=tellyfin-store-${VERSION_NAME}.apk" >> "$GITHUB_ENV"
          echo "STORE_AAB_NAME=tellyfin-store-${VERSION_NAME}.aab" >> "$GITHUB_ENV"

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/release.jks"

      - name: Build signed release APKs (sideload, both telemetry flavors)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          ./gradlew assembleSentryDirectRelease assembleNoSentryDirectRelease \
            -PversionCode="${{ env.VERSION_CODE }}" \
            -PversionName="${{ env.VERSION_NAME }}"

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/sentryDirect/release/app-sentryDirect-release.apk \
             "app/build/outputs/apk/sentryDirect/release/${{ env.SENTRY_APK_NAME }}"
          mv app/build/outputs/apk/noSentryDirect/release/app-noSentryDirect-release.apk \
             "app/build/outputs/apk/noSentryDirect/release/${{ env.NOSENTRY_APK_NAME }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Tellyfin ${{ env.VERSION_NAME }}"
          prerelease: ${{ contains(env.VERSION_NAME, '-') }}
          files: |
            app/build/outputs/apk/sentryDirect/release/${{ env.SENTRY_APK_NAME }}
            app/build/outputs/apk/noSentryDirect/release/${{ env.NOSENTRY_APK_NAME }}
          body: |
            ## Which build?

            - **`${{ env.SENTRY_APK_NAME }}`** — reports crashes/errors to help fix bugs
            - **`${{ env.NOSENTRY_APK_NAME }}`** — no crash reporting, no telemetry SDK at all

            Both are the same app otherwise. Installing one replaces the other (same package).

            ## Install on Fire TV / Android TV

            1. Download the build you want, above
            2. Enable *Unknown sources* in your device settings
               *(Settings → My Fire TV → Developer options → Install unknown apps)*
            3. Sideload with adb:
               ```
               adb install <the .apk you downloaded>
               ```

      - name: Build store release (APK for Amazon, AAB for Google Play)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          ./gradlew assembleSentryStoreRelease bundleSentryStoreRelease \
            -PversionCode="${{ env.VERSION_CODE }}" \
            -PversionName="${{ env.VERSION_NAME }}"

      - name: Rename store artifacts
        run: |
          mv app/build/outputs/apk/sentryStore/release/app-sentryStore-release.apk \
             "app/build/outputs/apk/sentryStore/release/${{ env.STORE_APK_NAME }}"
          mv app/build/outputs/bundle/sentryStoreRelease/app-sentryStore-release.aab \
             "app/build/outputs/bundle/sentryStoreRelease/${{ env.STORE_AAB_NAME }}"

      # Store artifacts are always the sentry (crash-reporting) flavor with the in-app
      # updater compiled out. They're not attached to the public GitHub Release — that page
      # is for sideloading, and a build that can't self-update would be a confusing pick
      # there. Instead they're workflow artifacts for us to manually submit to each console;
      # neither Play nor Amazon accepts fully automated first-time submissions anyway.
      - name: Upload store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tellyfin-store-${{ env.VERSION_NAME }}
          path: |
            app/build/outputs/apk/sentryStore/release/${{ env.STORE_APK_NAME }}
            app/build/outputs/bundle/sentryStoreRelease/${{ env.STORE_AAB_NAME }}
          retention-days: 90

            **versionCode:** ${{ env.VERSION_CODE }}
